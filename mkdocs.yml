site_name: iDMS Documentation
site_description: Official architecture and user manuals for the iDMS ecosystem.
site_author: RIVM
#A site url would be implicitly added to all internal links (e.g. images)!
#also would break when mirroring to GitHub. So keep all links relative!
#site_url: https://github.com/rivm-syso/idms_docs 
#site_url: !ENV [SITE_URL, "http://127.0.0.1:8000/"]
#use_directory_urls: true

#Dont show this, important are the 7 code-repos...
#repo_name: iDMS_docs
#repo_url: https://github.com/rivm-syso/idms_docs 

extra:
  social:
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.example.com/rivm-syso/idms_docs
      name: Internal GitLab
    - icon: fontawesome/brands/github
      link: https://github.com/your-username/idms_docs
      name: Public GitHub Mirror


# Theme configuration
theme:
  name: material
  logo: "!assets/images/favicon-96x96.png"
  #favicon: assets/images/favicon.ico
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
   #- navigation.expand  #(expands all sections)
    - search.suggest
    - search.highlight

plugins:
  - search
  - mermaid2

# Extensions for advanced formatting (code blocks, callouts, tables)
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - def_list
  - footnotes
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
       - name: mermaid
         class: mermaid
         format: !!python/name:pymdownx.superfences.fence_code_format

# REQUIRED for Mermaid to render in the browser:
#extra_javascript:
#  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

